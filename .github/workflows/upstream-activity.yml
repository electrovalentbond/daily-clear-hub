name: Upstream activity chart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-activity.yml'
      - 'docs/upstream-activity/**'
      - 'scripts/build_upstream_activity.py'
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-activity-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Fetch commit dates and build the chart
        run: python3 scripts/build_upstream_activity.py "$RUNNER_TEMP/upstream-activity"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/upstream-activity

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the dependency chart
        id: deployment
        uses: actions/deploy-pages@v5
