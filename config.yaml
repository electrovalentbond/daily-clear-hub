schedule_order: [honkai3, starrail, zzz, genshin, pcr, bhxy2, endfield]

games:
  honkai3:
    name: 崩坏3
    enabled: false
    backend: native
    platform: windows
    exe: BH3.exe
    resolution: [1920, 1080]
    templates: assets/local/honkai3/coco_annotations.json
    timeout_sec: 300
    steps: [bh3_claim_daily, bh3_claim_mail]
  starrail:
    name: 崩坏：星穹铁道
    enabled: false
    backend: native
    platform: windows
    exe: StarRail.exe
    resolution: [1920, 1080]
    templates: assets/local/starrail/coco_annotations.json
    timeout_sec: 300
    steps: [sr_claim_mail]
  zzz:
    name: 绝区零
    enabled: false
    backend: native
    platform: windows
    exe: ZenlessZoneZero.exe
    resolution: [1920, 1080]
    templates: assets/local/zzz/coco_annotations.json
    timeout_sec: 300
    steps: [zzz_claim_mail]
  genshin:
    name: 原神
    enabled: false
    backend: native
    platform: windows
    exe: YuanShen.exe
    resolution: [1920, 1080]
    templates: assets/local/genshin/coco_annotations.json
    timeout_sec: 300
    steps: [gi_mail, gi_commissions]
  pcr:
    name: 公主连结
    enabled: false
    backend: native
    platform: adb
    package: com.bilibili.priconne
    adb_serial: ""
    resolution: [1280, 720]
    templates: assets/local/pcr/coco_annotations.json
    timeout_sec: 300
    steps: [pcr_collect_gifts, pcr_collect_quests]
  bhxy2:
    name: 崩坏学园2
    enabled: false
    backend: native
    platform: adb
    package: ""
    adb_serial: ""
    resolution: [1280, 720]
    templates: assets/local/bhxy2/coco_annotations.json
    timeout_sec: 300
    steps: [bh2_mail, bh2_presence]
  endfield:
    name: 明日方舟：终末地
    enabled: false
    backend: native
    platform: windows
    exe: Endfield.exe
    resolution: [1920, 1080]
    templates: assets/local/endfield/coco_annotations.json
    timeout_sec: 420
    steps: [ef_mail, ef_storage, ef_daily, ef_pass]
