schedule_order:
  - honkai3
  - starrail
  - zzz
  - genshin
  - pcr
  - bhxy2

scheduler:
  task_timeout_sec: 1800
  max_retries: 2
  retry_delay_sec: 10

games:
  honkai3:
    enabled: true
    platform: windows
    tasks:
      - daily
  starrail:
    enabled: true
    platform: windows
    tasks:
      - daily
  zzz:
    enabled: true
    platform: windows
    tasks:
      - daily
  genshin:
    enabled: true
    platform: windows
    tasks:
      - daily
  pcr:
    enabled: true
    platform: adb
    emulator_index: 0
    package: com.bilibili.priconne
    resolution: "540,960,240"
    tasks:
      - daily
  bhxy2:
    enabled: true
    platform: adb
    emulator_index: 0
    # 包名需在 Windows 上用 adb shell pm list packages 确认后填写
    package: ""
    tasks:
      - daily
