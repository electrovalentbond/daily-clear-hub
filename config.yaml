schedule_order:
  - honkai3
  - pcr

scheduler:
  task_timeout_sec: 1800
  max_retries: 2
  retry_delay_sec: 10

games:
  honkai3:
    enabled: true
    platform: windows
    tasks:
      - daily
    # 步骤开关在 ok-script GUI 的「崩坏3 日常」任务内配置
  pcr:
    enabled: true
    platform: adb
    emulator_index: 0
    package: com.bilibili.priconne
    resolution: "540,960,240"
    tasks:
      - daily
    # 步骤开关在 ok-script GUI 的「公主连结 日常」任务内配置
  starrail:
    enabled: false
    platform: windows
    tasks: []
  zzz:
    enabled: false
    platform: windows
    tasks: []
  genshin:
    enabled: false
    platform: windows
    tasks: []
  bhxy2:
    enabled: false
    platform: adb
    emulator_index: 0
    tasks: []
